name: Lumen Performance Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  performance-bench:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

    - name: Download and Extract ONNX Runtime
      run: |
        # Create the target directory structure on the runner machine
        mkdir -p third_party/onnxruntime/lib
        mkdir -p third_party/onnxruntime/include

        # Download a modern ONNX Runtime Linux x64 release archive (v1.18.0)
        curl -L -o onnxruntime.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.18.0/onnxruntime-linux-x64-1.18.0.tgz
        tar -xzf onnxruntime.tgz

        # Copy the headers and shared object binary into place so CMake can find them
        cp -r onnxruntime-linux-x64-1.18.0/include/* third_party/onnxruntime/include/
        cp onnxruntime-linux-x64-1.18.0/lib/libonnxruntime.so* third_party/onnxruntime/lib/

    - name: Configure CMake with Environment Scaling
      run: |
        mkdir -p build
        cd build
        # We override the thread parameters down to 1 Producer and 1 Consumer 
        # to ensure perfect, un-throttled core execution on the 2-core GitHub Actions runner.
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCOMPILE_DEFINITIONS="NUM_PRODUCERS=1;NUM_CONSUMERS=1" \
              ..

    - name: Build Micro-Benchmark Target
      run: |
        cd build
        cmake --build . --target bench_pure_latency --config Release

    - name: Execute Latency SLA Validation Gate
      run: |
        cd build
        # Runs the binary. If P99 tail latency violates the SLA, 
        # the binary returns exit code 1, automatically failing the CI pipeline build.
        ./bench_pure_latency
